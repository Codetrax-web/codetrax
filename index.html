<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codetrax | Hub Digital</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="with-banner">
    <div id="loader"><div class="spinner"></div></div>

    <nav class="top-menu">
        <a href="#" class="active">Home</a>
        <a href="#">Que es</a>
        <a href="#">Porta</a>
        <a href="#">Recurs</a>
        <a href="#">contacto</a>
    </nav>

    <main id="content" style="display: none;">
        <div class="main-container">
            <header class="brand-block">
                <img src="assets/ima/log_codetrax.png" alt="Logo" class="main-logo-xl">

            <section class="action-block">

                        <p class="title">Terminal: buscar proyectos...</p>
                    </div>
                    <div class="body">
                        <pre class="pre"><code>- </code><code>npx </code><code class="cmd"></code></pre>
                    </div>

            </section>
        </div>
    </main>

    <script src="js/main.js"></script>

</html>
