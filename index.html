<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeTrax</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="main-header">
        <img src="assets/ima/log_codetrax.png" alt="Logo CodeTrax" class="logo">
        <h1>CODETRAX</h1>
    </header>

    <main>
        <label class="gt-field" for="gt-input-target">
          <span class="gt-field__label">Compile Target</span>
          <span class="gt-input">
            <span class="gt-input__prompt" aria-hidden="true">&gt;</span>
            <input id="gt-input-target" class="gt-input__control" type="text" placeholder="./build/main" />
            <span class="gt-input__caret" aria-hidden="true"></span>
          </span>
          <span class="gt-field__hint">Press <kbd class="gt-kbd">/</kbd> to focus · <kbd class="gt-kbd">Tab</kbd> to complete</span>
        </label>
    </main>
    <div id="content"></div>
    <nav class="menu">
    <a href="#" class="active" data-section="home">
        <span>Home</span>
    </a>
    <a href="#" data-section="files">
        <span>Files</span>
    </a>
    <a href="#" data-section="plans">
        <span>Plans</span>
    </a>
    <a href="#" data-section="settings">
        <span>Settings</span>
    </a>
    
</nav>

    <script src="js/script.js"></script>
</body>
</html>
