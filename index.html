<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codetrax Hub | Tu Espacio de Ingeniería</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="with-banner">
    <div id="loader"><div class="spinner"></div></div>

    <nav class="top-menu">
        <a href="#" class="active">Home</a>
        <a href="#files">Files</a>
        <a href="#plans">Plans</a>
        <a href="#settings">Settings</a>
    </nav>

    <main id="content" style="display: none;">
        
        <div class="main-container">
            
            <header class="brand-block">
                <img src="assets/ima/log_codetrax.png" alt="Logo Codetrax Grande" class="main-logo-xl">
                <h1 class="brand-name-display">CODETRAX</h1>
            </header>

            <section class="action-block">
                <div class="terminal-card" id="search-terminal">
                    <div class="wrap">
                        <div class="terminal">
                            <hgroup class="head">
                                <img src="assets/ima/log_codetrax.png" alt="Icono Terminal" class="terminal-icon">
                                <p class="title">Terminal: buscar proyectos...</p>
                            </hgroup>
                            <div class="body">
                                <pre class="pre"><code>- </code><code>npx </code><code class="cmd" data-cmd="listar-repos"></code></pre>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </main>

    <script src="js/main.js"></script>
</body>
</html>
