<!DOCTYPE html>
<html lang="es" class="no-js">

<head>
    <!-- Configuración básica de codificación y diseño responsive -->
    <meta charset="UTF-8">
    <!-- Animaciones SIEMPRE activas: intro, partículas y efectos CSS corren en todos los dispositivos, sin interruptor ni excepciones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO: descripción que aparece en Google, URL canónica (evita duplicados con github.io) y color del navegador móvil -->
    <meta name="description" content="Codetrax es una agencia de desarrollo digital: sitios web, apps, sistemas a medida, branding y multimedia para tu marca.">
    <meta name="robots" content="index, follow">
    <link rel="alternate" type="application/rss+xml" title="Codetrax" href="https://codetrax-web.github.io/codetrax/feed.xml">
    <link rel="canonical" href="https://codetrax-web.github.io/codetrax/">
    <!-- SEGURIDAD: política de contenido. Solo permite scripts propios (y Umami), bloquea iframes, objetos y <base> ajenos.
         Si agregas un servicio externo nuevo (otra fuente, otro script), añade su dominio aquí o el navegador lo bloqueará.
         PENDIENTE DE ESTRECHAR: connect-src aún usa https://*.supabase.co y https://*.workers.dev porque en
         js/main.js METRICS.url ('TU_PROYECTO.supabase.co') y CHAT_API_URL ('TU_URL_DEL_WORKER') siguen sin
         configurar (placeholder TU_). Cuando se configure el proyecto Supabase y el Worker exactos, sustituye
         ambos comodines por sus hosts exactos, p. ej. https://xxxx.supabase.co y https://codetrax-chat.<usuario>.workers.dev. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: https://lh3.googleusercontent.com; media-src 'self'; connect-src 'self' https://*.supabase.co https://*.workers.dev https://places.googleapis.com https://cloud.umami.is https://api-gateway.umami.dev; form-action 'self' https://formspree.io https://buttondown.com; frame-src 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests">
    <!-- Sin JavaScript no hay intro que mostrar: oculta la capa del vídeo (el <video> se llena desde js/intro.js). -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#070707">
    <!-- Título de la pestaña del navegador -->
    <title>Codetrax | Desarrollo web, apps y diseño</title>
    <!-- =================================================================
         CONFIGURACIÓN PARA VISTA PREVIA / TARJETA EN REDES SOCIALES (OPEN GRAPH)
         ================================================================= -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://codetrax-web.github.io/codetrax/">
    <meta property="og:title" content="Codetrax | Desarrollo web, apps y diseño">
    <meta property="og:description" content="Agencia de desarrollo digital: sitios web, apps, branding y multimedia a medida.">
    <!-- URL absoluta a la imagen de vista previa (se recomienda usar JPG o PNG de 1200x630px) -->
    <!-- Imagen para compartir en redes (1200x630 PNG) -->
    <meta property="og:image" content="https://codetrax-web.github.io/codetrax/assets/ima/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <!-- Configuración especial para tarjetas en Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://codetrax-web.github.io/codetrax/">
    <meta name="twitter:title" content="Codetrax | Desarrollo web, apps y diseño">
    <meta name="twitter:description" content="Agencia de desarrollo digital: sitios web, apps, branding y multimedia a medida.">
    <meta name="twitter:image" content="https://codetrax-web.github.io/codetrax/assets/ima/og.png">
    <!-- Favicon (icono de la pestaña del navegador) -->
    <!-- Favicon: cabeza del león (el logo completo no se lee a 32px) -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/ima/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/ima/favicon-180.png">
    <!-- Estilos CSS locales y librería externa de íconos (FontAwesome) -->
    <link rel="stylesheet" href="css/style.css?v=20261124">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Estilos del vídeo intro: movidos a css/style.css (sección VIDEO INTRO) para poder quitar 'unsafe-inline' de style-src en la CSP. -->
    <!-- Datos estructurados (JSON-LD) con datos reales del sitio. Las rutas hash (#/...) se
         resuelven en el cliente; no se listan como URLs separadas en el sitemap. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Codetrax",
          "url": "https://codetrax-web.github.io/codetrax/",
          "description": "Codetrax es una agencia de desarrollo digital: sitios web, apps, sistemas a medida, branding y multimedia para tu marca.",
          "email": "codetraxs@gmail.com",
          "sameAs": [
            "https://www.instagram.com/codetraxhp",
            "https://www.threads.net/@codetraxhp"
          ]
        },
        {
          "@type": "BlogPosting",
          "headline": "Cómo hacer un sistema de riego automático con Arduino",
          "description": "Sensor de humedad, relé y bomba: la lógica básica y un código base para empezar.",
          "datePublished": "2026-10-11",
          "dateModified": "2026-10-11",
          "author": { "@type": "Organization", "name": "Codetrax", "url": "https://codetrax-web.github.io/codetrax/" },
          "publisher": { "@type": "Organization", "name": "Codetrax", "url": "https://codetrax-web.github.io/codetrax/" },
          "mainEntityOfPage": "https://codetrax-web.github.io/codetrax/#/blog/riego-automatico-arduino",
          "url": "https://codetrax-web.github.io/codetrax/#/blog/riego-automatico-arduino",
          "inLanguage": "es-MX"
        }
      ]
    }
    </script>
</head>
<body>
    <!-- Enlace para teclado: salta el menú e ir directo al contenido -->
    <a href="#content" class="skip-link">Saltar al contenido</a>
    <!-- =====================================================
         1. PANTALLA DE CARGA / VIDEO INTRO
         ===================================================== -->
    <div id="video-intro-overlay">
        <video 
            id="intro-video" 
            autoplay 
            muted 
            playsinline 
            preload="metadata">
            <!-- preload="metadata": solo metadatos hasta que el usuario vea la intro; la lógica de
                 mostrarla una vez por sesión (sessionStorage) vive en js/intro.js y va junto con este cambio. -->
        </video>
        <!-- Botón interactivo para saltar la intro -->
        <button id="skip-intro">Omitir Intro ≫</button>
    </div>
    <!-- =====================================================
         2. FONDO ANIMADO DE PARTÍCULAS
         ===================================================== -->
    <canvas id="bg-particles" aria-hidden="true"></canvas>
    <!-- =====================================================
         3. ENCABEZADO Y MENÚ DE NAVEGACIÓN PRINCIPAL
         ===================================================== -->
    <header class="main-header">
        <div class="logo-container">
            <a href="#/" class="logo-link" aria-label="Codetrax - Ir al inicio"><img src="assets/ima/log_cod.webp" alt="Logotipo de Codetrax" class="logo"></a>
        </div>
        <nav class="menu" aria-label="Navegación principal">
            <!-- Rutas por hash: cada sección tiene URL propia. data-section conecta con views{} en main.js.
                 Los alias viejos files/plans/settings redirigen a las rutas nuevas en navigate() (js/main.js). -->
            <a href="#/" class="active" data-section="home"><span>INICIO</span></a>
            <a href="#/servicios" data-section="servicios"><span>SERVICIOS</span></a>
            <a href="#/recursos" data-section="recursos"><span>RECURSOS</span></a>
            <a href="#/blog" data-section="blog"><span>BLOG</span></a>
            <a href="#/portafolio" data-section="portafolio"><span>PORTAFOLIO</span></a>
            <a href="#/donar" data-section="donar"><span>APOYA</span></a>
            <a href="#/contacto" data-section="contacto"><span>CONTACTO</span></a>
        </nav>
        <!-- Selector de idioma ES/EN: guarda la elección y traduce la interfaz (ver applyI18n en main.js) -->
        <button id="lang-toggle" type="button" aria-label="Cambiar idioma / Change language">EN</button>
    </header>
    <!-- =====================================================
         4. CONTENIDO PRINCIPAL DINÁMICO
         ===================================================== -->
    <main>
        <div id="content" tabindex="-1"></div>
        <noscript><p class="noscript-msg">Activa JavaScript para ver el contenido, o escríbenos a codetraxs@gmail.com.</p></noscript>
    </main>
    <!-- =====================================================
         5. PIE DE PÁGINA (FOOTER)
         ===================================================== -->
    <footer class="site-footer">
        <p>『 © 2026 Codetrax. Construyendo el futuro.』</p>
        <p class="footer-links"><a href="#/privacidad">Aviso de privacidad</a> · <a href="#/terminos">Términos</a></p>
    </footer>
    <!-- Botón "volver arriba": aparece al bajar 400px (lógica en main.js) -->
    <button id="back-top" type="button" aria-label="Volver arriba" hidden><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
    <!-- =====================================================
         6. SCRIPTS / LÓGICA DE PROGRAMACIÓN
         ===================================================== -->
    <!-- Control del video intro -->
    <!-- Script de la intro movido a js/intro.js: permite una CSP sin scripts inline -->
    <script src="js/intro.js?v=20261124"></script>
    <!-- Archivo de JavaScript principal de tu aplicación -->
    <script src="js/main.js?v=20261124"></script>
</body>
</html>
